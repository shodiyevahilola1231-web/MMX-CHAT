<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMX-CHAT Login</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid silver;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #2f80ed;
            color: white;
            cursor: pointer;
        }

        #googleBtn {
            background: #db4437;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Kirish</h2>

        <input id="email" placeholder="Email" type="email">
        <input id="password" placeholder="Parol" type="password">

        <button onclick="loginEmail()">Kirish</button>
        <button id="googleBtn" onclick="googleLogin()">Google orqali kirish</button>

        <p style="margin-top:10px;">Hisob yo‘qmi? <a href="register.html">Ro‘yxatdan o‘tish</a></p>
    </div>

    <script>
        // Firebase config ↓↓↓ shu joyga Firebase’dan olgan config’ni qo‘yasiz
        const firebaseConfig = {
            apiKey: "SENING API KEY",
            authDomain: "SENING authDomain",
            projectId: "SENING projectId",
            storageBucket: "SENING storageBucket",
            messagingSenderId: "SENING messagingSenderId",
            appId: "SENING appId"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Email / Parol bilan kirish
        function loginEmail() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => location.href = "chat.html")
                .catch(err => alert(err.message));
        }

        // Google Login
        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => location.href = "chat.html")
                .catch(err => alert(err.message));
        }
    </script>

</body>
</html>
